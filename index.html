<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บไซต์แนะนำตัวเอง</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="profile-card">
    <img
      src="images/profile.jpg"
      alt="รูปโปรไฟล์ของฉัน"
      class="profile-image"
    >

    <h1>สวัสดีครับ/ค่ะ 👋</h1>
    <p class="subtitle">ยินดีต้อนรับสู่เว็บไซต์แนะนำตัวของฉัน</p>

    <section class="profile-info">
      <p><strong>ชื่อ–นามสกุล:</strong> นาย ภูวดล น่วมอนงค์</p>
      <p><strong>ชื่อเล่น:</strong> ดาฮา</p>
      <p><strong>รหัสนักเรียน:</strong> 68219010021</p>
    </section>

    <section class="motto">
      <h2>คติประจำใจ</h2>
      <p>ความพยายามอยู่ที่ไหน ความสำเร็จอยู่ที่นั่น</p>
    </section>

    <button id="greetButton" type="button">
      กดเพื่อทักทาย
    </button>

    <p id="greeting" aria-live="polite">
      ยินดีที่ได้รู้จักทุกคนนะ!
    </p>
  </main>
</body>
</html>
